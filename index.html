.card.mega{animation:pulse 2s ease-in-out infinite}

.card.ultra{animation:pulse 1.2s ease-in-out infinite}

.card.locked{box-shadow:none}

.front{transform:rotateY(180deg)}

function applyReward(g){let cards=[],del=0,delC=0;
 if(g.wipeCards){del+=Object.keys(S.owned).filter(k=>S.owned[k]>0).length;S.owned={}}
 (g.delCards||[]).forEach(id=>{if(S.owned[id]>0){del++;delete S.owned[id]}});S.deck=(S.deck||[]).filter(x=>S.owned[x]>0);
 if(g.zeroCoins){delC+=S.coins;S.coins=0}if(g.delCoins){const d=Math.min(S.coins,g.delCoins);delC+=d;S.coins-=d}
 if(g.coins)S.coins=Math.max(0,S.coins+g.coins);(g.cards||[]).forEach(id=>{if(CARDS[id]){addCard(id);cards.push(id)}});
 (g.rand||[]).forEach(x=>{for(let i=0;i<x.n;i++){const p=BYR[x.r];const id=p[Math.floor(Math.random()*p.length)];addCard(id);cards.push(id)}});return{cards,coins:g.coins||0,del,delC}}

 <div class="text-xs text-orange-300 mt-3">• การ์ดจะถูกถอดออกจากคลังทันทีและรอแอดมินอนุมัติ<br>• ถ้าไม่อนุมัติ การ์ดจะถูกคืนให้<br>• ตรวจเบอร์ให้ถูก โอนผิดเบอร์แก้ไม่ได้</div>
 <button class="btn btn-g w-full mt-3" onclick="cashSubmit(${id})">ยืนยันขาย</button>`)}
async function cashSubmit(id){const ph=($('#tmph').value||'').replace(/\D/g,'');if(!/^0[689]\d{8}$/.test(ph))return toast('ใส่เบอร์ TrueMoney 10 หลักให้ถูกต้อง');if((S.owned[id]||0)<1)return;
 const rid='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
 try{const ref=DB.doc('sells/'+UID);const sn=await ref.get();const cur=sn.exists?JSON.parse(JSON.stringify(sn.data())):{};cur[rid]={uid:UID,name:S.name,card:id,baht:cashPrice(id),phone:ph,status:'pending',ts:Date.now()};await ref.set(cur);
  S.owned[id]--;S.deck=S.deck.filter(x=>S.owned[x]>0);save();closeModal();toast('ส่งคำขอขายแล้ว รอแอดมินอนุมัติ ✅',3500);go(TAB,true)}catch(e){console.error(e);toast('ส่งคำขอไม่สำเร็จ')}}
function toggleDeck(id){if(S.deck.includes(id))S.deck=S.deck.filter(x=>x!==id);else{if(S.deck.length>=3)return toast('สำรับเต็ม 3 ใบ — เอาใบเดิมออกก่อน');S.deck.push(id)}save();detail(id)}
function sellDup(id){if((S.owned[id]||0)<2)return;S.owned[id]--;S.coins+=RAR[CARDS[id].r].sell;save();toast('ขายแล้ว +🪙'+RAR[CARDS[id].r].sell);detail(id);go(TAB,true)}
function autoDeck(){S.deck=Object.keys(S.owned).filter(k=>S.owned[k]>0).map(Number).sort((a,b)=>CARDS[b].p-CARDS[a].p).slice(0,3);save();go('battle',true)}

let BT=null,BU=null,BROLE=null,BCODE=null,RESOLVING=false;
const MULT=(a,b)=>{if(a==0&&b==2||a==2&&b==1||a==1&&b==0)return 1.3;if(b==0&&a==2||b==2&&a==1||b==1&&a==0)return .8;if(a==3&&b==4||a==4&&b==3)return 1.25;return 1};
function vBattle(v){const dp=S.deck.reduce((a,id)=>a+CARDS[id].p,0);
 v.innerHTML=`<div class="panel p-4"><div class="flex justify-between items-center mb-2"><div class="font-extrabold">สำรับประลอง (3 ใบ)</div><div class="text-amber-300 text-sm">พลังรวม ${dp}</div></div>
 <div class="grid grid-cols-3 gap-2">${[0,1,2].map(i=>S.deck[i]?cardEl(S.deck[i],{click:`detail(${S.deck[i]})`}):`<div class="card" style="--gc:#2a3160;--t:0;display:flex;align-items:center;justify-content:center;color:#475;font-size:2rem;background:#0a0d20" onclick="go('col')">＋</div>`).join('')}</div>

 ${ONLINE?`<button class="btn btn-g w-full" onclick="createRoom()">＋ สร้างห้องท้าเพื่อน</button>
 <div class="flex gap-2 mt-3"><input id="rc" maxlength="6" placeholder="รหัสห้อง" style="text-transform:uppercase;text-align:center;letter-spacing:.2em"><button class="btn btn-p" onclick="joinRoom()">เข้าห้อง</button></div>`:'<div class="text-center text-orange-300 text-sm">ต้องออนไลน์ถึงจะเล่นกับเพื่อนได้</div>'}</div>`}
function needDeck(){if(S.deck.length<3){toast('จัดสำรับให้ครบ 3 ใบก่อน');return true}return false}
const genCode=()=>Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
async function createRoom(){if(needDeck())return;const code=genCode();try{await DB.doc('battles/'+code).set({code,status:'waiting',h:{uid:UID,name:S.name,deck:S.deck},g:null,round:1,score:{h:0,g:0},picks:{},log:[],ts:Date.now()});openBattle(code,'h')}catch(e){console.error(e);toast('สร้างห้องไม่สำเร็จ (เช็กเน็ตและกฎ Firestore)')}}
async function joinRoom(){if(needDeck())return;const code=($('#rc').value||'').toUpperCase().trim();if(!code)return;try{const sn=await DB.doc('battles/'+code).get();if(!sn.exists)return toast('ไม่พบห้องนี้');const b=sn.data();
  if(b.h.uid===UID)return openBattle(code,'h');if(b.g&&b.g.uid===UID)return openBattle(code,'g');if(b.g)return toast('ห้องเต็มแล้ว');if(b.status==='done')return toast('ห้องนี้จบแล้ว');
  await DB.doc('battles/'+code).update({g:{uid:UID,name:S.name,deck:S.deck},status:'playing'});openBattle(code,'g')}catch(e){console.error(e);toast('เข้าห้องไม่สำเร็จ')}}
function openBattle(code,role){leaveBattle(true);BCODE=code;BROLE=role;BT=null;modal('<div class="text-center py-10">กำลังเชื่อมต่อ…</div>',true);
 BU=DB.doc('battles/'+code).onSnapshot(sn=>{if(!sn.exists)return;BT=JSON.parse(JSON.stringify(sn.data()));hostResolve();claimReward();paintBattle()},e=>console.error(e))}
function leaveBattle(silent){if(BU){BU();BU=null}BT=null;BCODE=null;if(!silent){closeModal();go('battle',true)}}
function powerOf(b,r,role){const my=b[role],op=b[role==='h'?'g':'h'];const mi=b.picks[role+r],oi=b.picks[(role==='h'?'g':'h')+r];const a=CARDS[my.deck[mi]],d=CARDS[op.deck[oi]];const rnd=mb(Array.from(b.code+r+role).reduce((x,ch)=>x*31+ch.charCodeAt(0)|0,7))();return Math.round(a.p*MULT(a.e,d.e)*(.9+rnd*.2))}
async function hostResolve(){const b=BT;if(BROLE!=='h'||!b||b.status!=='playing'||RESOLVING)return;const r=b.round;if(b.log.length>=r)return;if(b.picks['h'+r]==null||b.picks['g'+r]==null)return;RESOLVING=true;
 const ph=powerOf(b,r,'h'),pg=powerOf(b,r,'g'),w=ph>pg?'h':pg>ph?'g':'d';const sc={h:b.score.h+(w==='h'),g:b.score.g+(w==='g')};
 const entry={r,hc:b.h.deck[b.picks['h'+r]],gc:b.g.deck[b.picks['g'+r]],ph,pg,w};const log=[...b.log,entry];let done=r>=3||sc.h>=2||sc.g>=2;let win=null;
 if(done){win=sc.h>sc.g?'h':sc.g>sc.h?'g':'d';if(win==='d'){const th=b.h.deck.reduce((a,i)=>a+CARDS[i].p,0),tg=b.g.deck.reduce((a,i)=>a+CARDS[i].p,0);win=th>tg?'h':tg>th?'g':'d'}}
 try{await DB.doc('battles/'+BCODE).update({score:sc,log,round:done?r:r+1,status:done?'done':'playing',winner:win})}catch(e){console.error(e)}RESOLVING=false}
function claimReward(){const b=BT;if(!b||b.status!=='done'||S.claimed.includes(b.code))return;const win=b.winner===BROLE;S.coins+=win?80:20;S.claimed.push(b.code);S.claimed=S.claimed.slice(-30);save();toast(win?'🏆 ชนะ! +🪙80':'แพ้ไม่เป็นไร +🪙20',3500)}
async function pickCard(i){const b=BT;if(!b||b.status!=='playing')return;const k=BROLE+b.round;if(b.picks[k]!=null)return;const used=Object.keys(b.picks).some(x=>x[0]===BROLE&&b.picks[x]===i);if(used)return toast('การ์ดใบนี้ใช้ไปแล้ว');
 b.picks[k]=i;paintBattle();try{await DB.doc('battles/'+BCODE).update({picks:{[k]:i}})}catch(e){console.error(e);toast('ส่งการ์ดไม่สำเร็จ')}}
function paintBattle(){const b=BT;if(!b||!$('#modal'))return;const opR=BROLE==='h'?'g':'h',me=b[BROLE],op=b[opR];
 const usedMine=Object.keys(b.picks).filter(x=>x[0]===BROLE).map(x=>b.picks[x]);const picked=b.picks[BROLE+b.round]!=null;
 let head=`<div class="flex justify-between items-center mb-2"><div class="chip">ห้อง <b class="tracking-widest">${b.code}</b></div><button class="chip" onclick="leaveBattle()">ออก ✕</button></div>
 <div class="grid grid-cols-3 items-center text-center mb-3"><div><div class="font-bold truncate">${esc(me.name)}</div><div class="text-3xl font-extrabold text-emerald-300">${b.score[BROLE]}</div></div><div class="text-slate-500">VS</div><div><div class="font-bold truncate">${op?esc(op.name):'…'}</div><div class="text-3xl font-extrabold text-rose-300">${b.score[opR]}</div></div></div>`;
 let body='';
 if(b.status==='waiting')body=`<div class="text-center py-6"><div class="text-5xl mb-2">⏳</div>รอเพื่อนเข้าห้อง…<div class="mt-2 text-3xl font-extrabold tracking-[.3em] text-amber-300">${b.code}</div><div class="text-xs text-slate-400 mt-1">ส่งรหัสนี้ให้เพื่อน แล้วให้กด “เข้าห้อง”</div></div>`;
 else{const opDeck=op?op.deck:[];
  body=`<div class="text-xs text-slate-400 mb-1">การ์ดของ ${esc(op.name)}</div><div class="grid grid-cols-3 gap-2 mb-3">${opDeck.map((id,i)=>{const u=b.log.some(l=>(opR==='h'?l.hc:l.gc)===id);return `<div style="${u?'opacity:.35':''}">${cardEl(id)}</div>`}).join('')}</div>
  ${b.status==='done'?`<div class="text-center py-3"><div class="text-3xl font-extrabold">${b.winner===BROLE?'🏆 คุณชนะ!':b.winner==='d'?'🤝 เสมอ':'💀 คุณแพ้'}</div><button class="btn btn-p mt-3" onclick="leaveBattle()">กลับ</button></div>`:`<div class="text-center text-sm mb-2 font-bold">รอบที่ ${b.round}/3 — ${picked?'รอคู่ต่อสู้เลือก…':'เลือกการ์ดของคุณ 👇'}</div>`}
  <div class="grid grid-cols-3 gap-2">${me.deck.map((id,i)=>{const u=usedMine.includes(i);const cur=b.picks[BROLE+b.round]===i;return `<div style="${u&&!cur?'opacity:.35;':''}${cur?'outline:3px solid #10b981;border-radius:16px;':''}">${cardEl(id,{click:b.status==='playing'&&!u&&!picked?`pickCard(${i})`:''})}</div>`}).join('')}</div>
  ${b.log.length?`<div class="mt-3 space-y-1">${b.log.map(l=>{const mine=BROLE==='h'?[l.hc,l.ph]:[l.gc,l.pg],oth=BROLE==='h'?[l.gc,l.pg]:[l.hc,l.ph];const res=l.w==='d'?'เสมอ':l.w===BROLE?'ชนะ':'แพ้';return `<div class="flex items-center justify-between text-xs p-2 rounded-lg" style="background:#161b3a"><span>R${l.r}</span><span>${ELS[CARDS[mine[0]].e].e} ${CARDS[mine[0]].n} <b class="text-amber-300">${mine[1]}</b></span><b class="${res==='ชนะ'?'text-emerald-300':res==='แพ้'?'text-rose-300':'text-slate-300'}">${res}</b><span><b class="text-amber-300">${oth[1]}</b> ${CARDS[oth[0]].n} ${ELS[CARDS[oth[0]].e].e}</span></div>`}).join('')}</div>`:''}`}
 const sh=document.querySelector('#modal .sheet');if(sh)sh.innerHTML=head+body}

async function sendTopup(){const p=PKG[PSEL],ref=($('#tref').value||'').trim();if(!ref)return toast('ใส่เลขอ้างอิงหรือเวลาโอนก่อน');

async function sha(s){if(!(window.crypto&&crypto.subtle))throw new Error('nosubtle');const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
const codeId=async c=>(await sha('code:'+c.trim().toUpperCase())).slice(0,32);
async function redeem(){if(!ONLINE)return toast('ต้องออนไลน์');const c=($('#cd').value||'').trim();if(!c)return;
 try{const id=await codeId(c);if(S.redeemed[id])return toast('คุณใช้โค้ดนี้ไปแล้ว');const ref=DB.doc('codes/'+id),sn=await ref.get();if(!sn.exists)return toast('โค้ดไม่ถูกต้อง');const d=sn.data();const used=Object.keys(d.used||{}).length;
  if(d.max&&used>=d.max)return toast('โค้ดนี้ถูกใช้ครบแล้ว');await ref.update({used:{[UID]:true}});S.redeemed[id]=1;const r=applyReward(d);save();toast(`รับโค้ดสำเร็จ! ${r.coins?'🪙'+fmt(r.coins)+' ':''}${r.cards.length?'การ์ด '+r.cards.length+' ใบ':''}`,3500);if(r.cards.length&&r.cards.length<=30)reveal(r.cards.map(id=>({id,isNew:true})));go('topup',true)}catch(e){console.error(e);toast('ใช้โค้ดไม่สำเร็จ')}}

 <div class="grid grid-cols-4 gap-1 mb-3" id="admTabs"></div><div id="admBody"></div>`);admBadges();admBody()}
function admBadges(){const t=$('#admTabs');if(!t)return;const pt=ALLTOP.filter(x=>x.status==='pending').length,ps=ALLSELL.filter(x=>x.status==='pending').length;
 t.innerHTML=[['give','🎁','จัดการ',0],['code','🎟','โค้ด',0],['top','💰','เติมเงิน',pt],['sell','💵','ถอนเงิน',ps]].map(([k,i,l,n])=>`<button class="btn ${ADM.tab==k?'btn-p':'btn-s'} !py-2 !px-1 flex-col !gap-0 text-xs" onclick="ADM.tab='${k}';admBadges();admBody()"><span class="text-base">${i}</span><span>${l}${n?`<span class="dot">${n}</span>`:''}</span></button>`).join('')}
function pickerHTML(){return `<details class="mt-1"><summary class="chip inline-block !text-sm !py-1">🃏 เลือกการ์ด ▾</summary><div class="mt-2">
 <input id="aq" placeholder="ค้นหาชื่อ หรือเลข # แล้วแตะเพื่อเพิ่ม" oninput="admSearch()"><div id="ares" class="grid grid-cols-3 gap-1 mt-2 text-xs"></div>
 <div class="flex gap-2 mt-2"><select id="arr" style="width:auto;flex:1"><option value="-1">การ์ดทั้งหมด (${CARDS.length-1})</option>${RAR.map((r,i)=>`<option value="${i}">ทั้งระดับ ${r.k} (${r.n})</option>`).join('')}</select><button class="btn btn-s !py-2" onclick="admAddR()">＋ เพิ่ม</button></div></div></details>
 <div id="selBox" class="mt-2"></div>`}
function admSelPaint(){const e=$('#selBox');if(!e)return;const sel=[...ADM.sel];
 e.innerHTML=sel.length?`<div class="text-xs text-slate-400 mb-1">เลือกแล้ว <b class="text-white">${sel.length}</b> ใบ</div><div class="flex flex-wrap gap-1">${sel.slice(0,24).map(i=>`<span class="chip" style="border-color:${RAR[CARDS[i].r].c}">#${i} <button onclick="admRm(${i})">✕</button></span>`).join('')}${sel.length>24?`<span class="chip">+${sel.length-24}</span>`:''}</div><button class="chip mt-2" onclick="ADM.sel.clear();admSelPaint()">ล้างที่เลือก</button>`:'<div class="text-xs text-slate-500">ยังไม่ได้เลือกการ์ด</div>'}
function admBody(){const b=$('#admBody');if(!b)return;
 if(ADM.tab==='give'){const del=ADM.mode==='del';b.innerHTML=`<div class="sec"><h4>① เลือกผู้เล่น</h4><select id="admPl" onchange="ADM.to=this.value"></select></div>
  <div class="sec"><h4>② ทำอะไร</h4><div class="seg"><button class="${del?'':'on'}" onclick="ADM.mode='add';admBody()">✨ เสก / เพิ่ม</button><button class="${del?'on red':''}" onclick="ADM.mode='del';admBody()">🗑 ลบ</button></div></div>
  <div class="sec"><h4>③ เหรียญ 🪙 ${del?'(จำนวนที่หักออก)':'(จำนวนที่เพิ่ม)'}</h4><input id="agc" type="number" min="0" value="${ADM.n||0}" oninput="ADM.n=this.value"></div>
  <div class="sec"><h4>④ การ์ด ${del?'(ลบทุกใบของการ์ดที่เลือก)':'(เสกให้ 1 ใบต่อการ์ด)'}</h4>${pickerHTML()}</div>
  <button class="btn w-full ${del?'':'btn-y'}" style="${del?'background:linear-gradient(135deg,#ef4444,#be123c);color:#fff':''}" onclick="admGive()">${del?'🗑 ลบตามที่เลือก':'✨ เสกให้เลย'}</button>
  ${del?`<details class="sec mt-3" style="border-color:#7f1d1d"><summary class="text-rose-300">⚠️ ลบแบบเหมา</summary><div class="text-xs text-slate-400 my-2">แตะ 2 ครั้งเพื่อยืนยัน · ย้อนกลับไม่ได้</div><div class="grid grid-cols-2 gap-2"><button id="dz" class="btn btn-s !py-2" onclick="admDanger('zero')">ล้างเหรียญเป็น 0</button><button id="dw" class="btn btn-s !py-2" onclick="admDanger('wipe')">ลบการ์ดทั้งหมด</button></div></details>`:''}`;admRefresh();admSelPaint()}
 else if(ADM.tab==='code'){b.innerHTML=`<div class="sec"><h4>① ตั้งโค้ด</h4><div class="grid grid-cols-2 gap-2"><div><div class="text-[11px] text-slate-400 mb-1">ตัวโค้ด (ว่าง = สุ่ม)</div><input id="cc" placeholder="เช่น HELLO" style="text-transform:uppercase"></div><div><div class="text-[11px] text-slate-400 mb-1">ใช้ได้กี่คน (0 = ไม่จำกัด)</div><input id="cm" type="number" value="1"></div></div></div>
  <div class="sec"><h4>② รางวัล</h4><div class="text-[11px] text-slate-400 mb-1">เหรียญ 🪙</div><input id="ccn" type="number" value="0">
  <div class="grid grid-cols-2 gap-2 mt-2"><div><div class="text-[11px] text-slate-400 mb-1">สุ่มการ์ดระดับ</div><select id="crr"><option value="-1">ไม่เอา</option>${RAR.map((r,i)=>`<option value="${i}">${r.k}</option>`).join('')}</select></div><div><div class="text-[11px] text-slate-400 mb-1">จำนวนใบ</div><input id="crn" type="number" value="1"></div></div>
  <div class="text-[11px] text-slate-400 mt-3 mb-1">หรือระบุการ์ดตรงตัว</div>${pickerHTML()}</div>
  <button class="btn btn-g w-full" onclick="admMakeCode()">สร้างโค้ด</button>
  <div class="sec mt-3"><h4>โค้ดที่มี (เก็บถาวร)</h4>${VAULT.length?VAULT.sort((a,b)=>b.ts-a.ts).map(c=>`<div class="flex items-center justify-between text-sm py-2" style="border-bottom:1px solid #1a2040"><div><b class="tracking-widest text-amber-300 select-all">${esc(c.code)}</b><div class="text-xs text-slate-400">🪙${fmt(c.coins||0)} · การ์ด ${(c.cards||[]).length}${(c.rand||[]).map(x=>' · สุ่ม'+RAR[x.r].k+'×'+x.n).join('')} · ใช้ ${c.usedN||0}/${c.max||'∞'}</div></div><button class="chip" onclick="admDelCode('${c.id}')">ลบ</button></div>`).join(''):'<div class="text-sm text-slate-500">ยังไม่มีโค้ด (ต้องเป็นเจ้าของลิงก์ถึงจะเห็นรายการ)</div>'}</div>`;refreshUsed();admSelPaint()}
 else if(ADM.tab==='sell'){b.innerHTML=ALLSELL.length?ALLSELL.slice(0,40).map(t=>`<div class="p-3 mb-2 rounded-xl" style="background:#161b3a"><div class="flex gap-3"><div style="width:72px;flex:none">${CARDS[t.card]?cardEl(t.card):''}</div><div class="flex-1 min-w-0 text-sm"><div class="flex justify-between"><b class="truncate">${esc(t.name)}</b><b class="text-emerald-300">฿${t.baht}</b></div><div class="text-xs text-slate-400">#${t.card} ${esc(CARDS[t.card]?CARDS[t.card].n:'')}</div><div class="mt-1">📱 TrueMoney <b class="tracking-wider text-amber-300 select-all">${esc(t.phone)}</b></div><div class="text-[11px] text-slate-500">${new Date(t.ts).toLocaleString('th-TH')}</div></div></div>${t.status==='pending'?`<div class="grid grid-cols-2 gap-2 mt-2"><button class="btn btn-g !py-2" onclick="admSell('${t.doc}','${t.id}','approved')">อนุมัติ</button><button class="btn btn-s !py-2" onclick="admSell('${t.doc}','${t.id}','rejected')">ปฏิเสธ (คืนการ์ด)</button></div>`:t.status==='approved'?`<button class="btn btn-y w-full mt-2 !py-2" onclick="admSell('${t.doc}','${t.id}','paid')">โอนเงินให้แล้ว ✔ ทำเครื่องหมาย</button>`:`<div class="text-xs mt-1 ${t.status=='paid'?'text-emerald-300':'text-rose-300'}">${t.status=='paid'?'โอนแล้ว':'ปฏิเสธแล้ว'}</div>`}</div>`).join(''):'<div class="text-center text-slate-500 py-6">ยังไม่มีคำขอขายการ์ด</div>'}
 else{b.innerHTML=ALLTOP.length?ALLTOP.slice(0,40).map(t=>`<div class="p-3 mb-2 rounded-xl" style="background:#161b3a"><div class="flex justify-between"><b>${esc(t.name)}</b><b class="text-emerald-300">฿${t.baht} → 🪙${fmt(t.coins)}</b></div><div class="text-xs text-slate-400">อ้างอิง: ${esc(t.ref)} · ${new Date(t.ts).toLocaleString('th-TH')}</div>${t.status==='pending'?`<div class="grid grid-cols-2 gap-2 mt-2"><button class="btn btn-g !py-2" onclick="admTop('${t.id}',1)">อนุมัติ</button><button class="btn btn-s !py-2" onclick="admTop('${t.id}',0)">ปฏิเสธ</button></div>`:`<div class="text-xs mt-1 ${t.status=='approved'?'text-emerald-300':'text-rose-300'}">${t.status=='approved'?'อนุมัติแล้ว':'ปฏิเสธแล้ว'}</div>`}</div>`).join(''):'<div class="text-center text-slate-500 py-6">ยังไม่มีรายการแจ้งโอน</div>'}}
function admRefresh(){const s=$('#admPl');if(!s)return;const cur=s.value;s.innerHTML=`<option value="${UID}">ตัวเอง (${esc(S.name)})</option>`+Object.entries(PLAYERS).filter(([id])=>id!==UID).map(([id,p])=>`<option value="${id}">${esc(p.name)} · ${p.uniq||0} ใบ</option>`).join('');const want=cur||ADM.to;if(want&&[...s.options].some(o=>o.value===want))s.value=want}
function admSearch(){const q=($('#aq').value||'').trim().toLowerCase(),r=$('#ares');if(!q){r.innerHTML='';return}
 const out=CARDS.slice(1).filter(c=>String(c.id)===q||c.n.toLowerCase().includes(q)).slice(0,18);r.innerHTML=out.map(c=>`<button class="p-1 rounded-lg text-left" style="border:1px solid ${RAR[c.r].c};background:#0a0d20" onclick="admAdd(${c.id})"><b style="color:${RAR[c.r].c}">#${c.id}</b> ${ELS[c.e].e}<br>${c.n}</button>`).join('')}
function admAdd(id){ADM.sel.add(id);admSelPaint()}
function admRm(id){ADM.sel.delete(id);admSelPaint()}
function admAddR(){const v=parseInt($('#arr').value);(v<0?CARDS.slice(1).map(c=>c.id):BYR[v]).forEach(i=>ADM.sel.add(i));admSelPaint();toast('เลือกแล้วทั้งหมด '+ADM.sel.size+' ใบ')}
async function admSend(g,msgSelf){const to=$('#admPl').value;
 if(to===UID){const r=applyReward(g);save();toast(msgSelf(r),4000);if(r.cards.length&&r.cards.length<=30)reveal(r.cards.map(id=>({id,isNew:true})));go(TAB,true);return true}
 if(!DB){toast('ต้องออนไลน์');return false}
 try{await DB.collection('grants').add({to,...g,ts:Date.now()});toast('ส่งคำสั่งให้ผู้เล่นแล้ว (มีผลเมื่อเขาเปิดเกม)',3500);return true}catch(e){console.error(e);toast('ส่งไม่สำเร็จ');return false}}
async function admGive(){const del=ADM.mode==='del',n=Math.max(0,parseInt($('#agc').value)||0),cards=[...ADM.sel];if(!n&&!cards.length)return toast('ยังไม่ได้เลือกอะไรเลย');
 const ok=del?await admSend({delCoins:n,delCards:cards},r=>`ลบแล้ว: หักเหรียญ 🪙${fmt(r.delC)} · ลบการ์ด ${r.del} ใบ`):await admSend({coins:n,cards},r=>`เสกให้ตัวเองแล้ว 🪙${fmt(n)} + การ์ด ${r.cards.length} ใบ`);
 if(ok){ADM.sel.clear();ADM.n=0;admBody()}}
let DANGER=null;
async function admDanger(k){const id=k==='zero'?'dz':'dw',el=$('#'+id);if(DANGER!==k){DANGER=k;el.textContent='⚠️ แตะอีกครั้งเพื่อยืนยัน';setTimeout(()=>{if(DANGER===k){DANGER=null;const e=$('#'+id);if(e)e.textContent=k==='zero'?'ล้างเหรียญเป็น 0':'ลบการ์ดทั้งหมด'}},4000);return}
 DANGER=null;await admSend(k==='zero'?{zeroCoins:true}:{wipeCards:true},r=>k==='zero'?`ล้างเหรียญ (หัก 🪙${fmt(r.delC)})`:`ลบการ์ดทั้งหมด ${r.del} ใบ`);admBody()}
async function admMakeCode(){if(!DB)return toast('ต้องออนไลน์');let code=($('#cc').value||'').trim().toUpperCase()||('PCL-'+genCode()+genCode());const max=parseInt($('#cm').value)||0,coins=parseInt($('#ccn').value)||0,rr=parseInt($('#crr').value),rn=parseInt($('#crn').value)||1,cards=[...ADM.sel];
 const rand=rr>=0?[{r:rr,n:rn}]:[];if(!coins&&!cards.length&&!rand.length)return toast('ใส่รางวัลก่อน');
 try{const id=await codeId(code);const data={coins,cards,rand,max,used:{},ts:Date.now()};await DB.doc('codes/'+id).set(data);await DB.doc('vault/'+id).set({code,coins,cards,rand,max,ts:Date.now()});ADM.sel.clear();toast('สร้างโค้ด '+code+' แล้ว (บันทึกถาวร)',4000);admBody()}catch(e){console.error(e);toast('สร้างไม่สำเร็จ')}}
async function refreshUsed(){if(!DB)return;for(const c of VAULT){try{const s=await DB.doc('codes/'+c.id).get();if(s.exists)c.usedN=Object.keys(s.data().used||{}).length}catch{}}}
async function admDelCode(id){try{await DB.doc('codes/'+id).delete();await DB.doc('vault/'+id).delete()}catch(e){console.error(e)}}
async function admSell(doc,id,st){const t=ALLSELL.find(x=>x.id===id&&x.doc===doc);if(!t)return;try{await DB.doc('sells/'+doc).update({[id]:{status:st}});if(st==='rejected')await DB.collection('grants').add({to:t.uid,coins:0,cards:[t.card],note:'refund',ts:Date.now()});toast(st==='approved'?'อนุมัติแล้ว — โอนเงินให้เขาแล้วกด “โอนแล้ว”':st==='paid'?'บันทึกว่าโอนแล้ว':'ปฏิเสธและคืนการ์ดแล้ว',3500)}catch(e){console.error(e);toast('ทำรายการไม่สำเร็จ')}}
async function admTop(id,ok){const t=ALLTOP.find(x=>x.id===id);if(!t)return;try{await DB.doc('topups/'+id).update({status:ok?'approved':'rejected'});if(ok)await DB.collection('grants').add({to:t.uid,coins:t.coins,cards:[],note:'topup',ts:Date.now()});toast(ok?'อนุมัติแล้ว':'ปฏิเสธแล้ว')}catch(e){console.error(e);toast('ทำรายการไม่สำเร็จ')}}

boot();
</script>
</body>
</html>
